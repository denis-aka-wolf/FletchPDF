name: fletchpdf
description: Local-first desktop PDF workspace built with Flutter and Dart.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
